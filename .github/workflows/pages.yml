name: Deploy KnowinSpatial Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check static entry points
        run: |
          test -s index.html
          test -s style.css
          test -s assets/favicon.svg
          test -s KnowinMem/index.html
          test -s KnowinMem/app.js
          test -s KnowinMem/data/dashboard.json
          test -s KnowinMem/data/samples.json
          test -s KnowinMem/data/results.csv
          test -s KnowinMem/reports/technical-roadmap.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
